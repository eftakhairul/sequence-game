# /etc/nginx/sites-available/lineup  (then: ln -s ../sites-available/lineup /etc/nginx/sites-enabled/)
# Replace play.example.com with your domain, then run: sudo certbot --nginx -d play.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lineup {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;

    # Socket.IO (WebSocket upgrade + long-polling fallback)
    location /socket.io/ {
        proxy_pass http://lineup;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Everything else: static web app, SPA routes and /healthz
    location / {
        proxy_pass http://lineup;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}
